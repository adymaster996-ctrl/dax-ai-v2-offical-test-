<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101119">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Dax AI — Welcome</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101119;color:#f3f4fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.card{width:min(380px,100%);background:#171923;border:1px solid #2d3040;border-radius:20px;padding:26px;text-align:center}
.mark{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(140deg,#d6c8ff,#8b7cff);display:grid;place-items:center;color:#171523;font-size:34px}
h1{font-size:22px;margin:0 0 4px}p{color:#a1a5b8;font-size:13px;margin:0 0 16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#101119;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{background:transparent;color:#a1a5b8;padding:9px}.tabs button.on{background:#222431;color:#f3f4fa}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #393b4d;background:#191b27;color:inherit;font:inherit;font-size:16px;margin-bottom:10px}
button{width:100%;padding:13px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
#go{background:#d8ccff;color:#1b1828}#guest{background:transparent;color:#d4c6ff;border:1px solid #393b4d;margin-top:10px}
button:disabled{opacity:.5}#err{color:#ffb8b8;font-size:13px;min-height:18px;margin-top:10px}[hidden]{display:none!important}
.or{color:#73778c;font-size:12px;margin-top:12px}
</style>
</head>
<body>
<main class="card">
  <div class="mark">✳</div>
  <h1>Dax AI <small style="font-size:12px;color:#a1a5b8;font-weight:500;">v1</small></h1>
  <p>Log in to keep your higher message limit.</p>
  <div class="tabs" id="tabs"><button type="button" class="on" data-mode="login">Log in</button><button type="button" data-mode="signup">Sign up</button></div>
  <form id="f">
    <input id="email" type="email" autocomplete="email" placeholder="Email" required>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required minlength="8">
    <button id="go" type="submit">Log in</button>
  </form>
  <div id="guestWrap" hidden><div class="or">or</div><button id="guest" type="button">Continue as guest</button></div>
  <div id="err" role="alert"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let mode = "login";
function setMode(m) {
  mode = m;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("go").textContent = m === "login" ? "Log in" : "Create account";
  $("pw").autocomplete = m === "login" ? "current-password" : "new-password";
  $("err").textContent = "";
}
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (r.ok) { location.replace("/"); return; }
  $("err").textContent = d.error || "Something went wrong.";
}
$("f").addEventListener("submit", async e => {
  e.preventDefault(); $("go").disabled = true; $("err").textContent = "";
  try { await post(mode === "login" ? "/api/login" : "/api/signup", { email: $("email").value, password: $("pw").value }); }
  catch { $("err").textContent = "Couldn’t reach the server."; }
  $("go").disabled = false;
});
$("guest").addEventListener("click", async () => {
  $("err").textContent = "";
  try { await post("/api/guest"); } catch { $("err").textContent = "Couldn’t reach the server."; }
});
fetch("/api/options").then(r => r.json()).then(o => {
  if (o.guest) { $("guestWrap").hidden = false; $("guest").textContent = "Continue as guest (" + o.guestLimit + " messages/day)"; }
  if (!o.signup) { document.querySelector('[data-mode="signup"]').hidden = true; }
}).catch(() => {});
</script>
</body>
</html>
